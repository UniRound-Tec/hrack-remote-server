# HRack 平台一键部署：relay（中继）+ web（平台站）+ 可选 nginx 边缘。
# 用法：
#   docker compose up -d --build                # relay + web
#   docker compose --profile edge up -d --build # 连同 nginx（80/443）一起
# 密钥类环境变量放在同目录 .env（见下方 environment 注释），不要写进本文件。
#
# 端口约定（PAIRING-PLATFORM-SPEC §4）：
#   对外仅暴露 nginx（或 host 反代）；web 与 relay 走内部网络。
#   不启用 edge profile 时，可自行把 30001/30002 映射给宿主反代。

services:
  relay:
    build:
      context: ../relay
    environment:
      # 对外可见源，决定 joinUrl 拼接；带上 nginx/反代 对外的 https 域名
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set in .env}
      BASE_PATH: /remote
      # 服务凭证：web 调中继 create/探活使用；未设置时创建一律 401
      RELAY_SERVICE_TOKEN: ${RELAY_SERVICE_TOKEN:?set in .env}
      # 生成页匿名创建调试开关，生产保持空
      ENABLE_DEV_CREATE: ${ENABLE_DEV_CREATE:-}
    restart: unless-stopped
    # 中继维持单副本铁律：内存态房间，无状态卷
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"

  web:
    build:
      context: ../web
    environment:
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      RELAY_INTERNAL_ORIGIN: http://relay:3000
      RELAY_SERVICE_TOKEN: ${RELAY_SERVICE_TOKEN:?set in .env}
      PAIRING_ENC_KEY: ${PAIRING_ENC_KEY:?set in .env}
      # OAuth / 邮件（可选，未配置时验证邮件打印到服务端控制台）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      # SQLite 单文件：备份即拷贝（spec §8）
      - web-data:/app/data
    expose:
      - "3000"
    # 不上 edge profile 时，取消注释从宿主直连调试：
    # ports:
    #   - "30001:3000"

  nginx:
    image: nginx:1.27-bookworm
    profiles:
      - edge
    depends_on:
      - web
      - relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.hrack.conf.example:/etc/nginx/conf.d/default.conf:ro
      # 证书路径按实际环境替换
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  web-data:
