# HRack 平台一键部署：relay（中继）+ web（平台站）+ 配对协调器 + 可选 nginx 边缘。
# 用法：
#   docker compose up -d --build                # relay + web + 协调器 + 监控
#   docker compose --profile edge up -d --build      # 连同 TLS nginx（80/443）
#   docker compose --profile host-edge up -d --build # 给宿主反代的 loopback 单端口
# 密钥类环境变量放在同目录 .env（见下方 environment 注释），不要写进本文件。
#
# 端口约定（PAIRING-PLATFORM-SPEC §4）：
#   对外仅暴露 nginx（或 host 反代）；web 与 relay 走内部网络。
#   不启用 edge profile 时，可自行把 30001/30002 映射给宿主反代。

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  relay:
    build:
      context: ../relay
    environment:
      # 对外可见源，决定 joinUrl 拼接；带上 nginx/反代 对外的 https 域名
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set in .env}
      BASE_PATH: /remote
      # 服务凭证：内部创建、吊销与期望状态同步；未设置时创建一律 401
      RELAY_SERVICE_TOKEN: ${RELAY_SERVICE_TOKEN:?set in .env}
      # 生成页匿名创建调试开关，生产保持空
      ENABLE_DEV_CREATE: ${ENABLE_DEV_CREATE:-}
    restart: unless-stopped
    logging: *bounded-logs
    # 中继维持单副本铁律：内存态房间，无状态卷
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"

  web:
    build:
      context: ../web
    environment:
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      RELAY_INTERNAL_ORIGIN: http://relay:3000
      RELAY_SERVICE_TOKEN: ${RELAY_SERVICE_TOKEN:?set in .env}
      PAIRING_ENC_KEY: ${PAIRING_ENC_KEY:?set in .env}
      SETTINGS_ENC_KEY: ${SETTINGS_ENC_KEY:-}
      # OAuth / 邮件（可选；非空 MAIL_PROVIDER 会钉死 provider 种类）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-}
      # 首位管理员：setup token 是无邮件逃生；bootstrap email 只做正常注册后的自动提权
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      # SQLite 单文件：备份即拷贝（spec §8）
      - web-data:/app/data
    expose:
      - "3000"
    # 不上 edge profile 时，取消注释从宿主直连调试：
    # ports:
    #   - "30001:3000"

  pairing-reconciler:
    build:
      context: ../web
    command:
      - node
      - dist-reconciler/scripts/pairing-reconciler.js
    environment:
      HRACK_WEB_DATA: /app/data
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set in .env}
      RELAY_INTERNAL_ORIGIN: http://relay:3000
      RELAY_SERVICE_TOKEN: ${RELAY_SERVICE_TOKEN:?set in .env}
      PAIRING_ENC_KEY: ${PAIRING_ENC_KEY:?set in .env}
      PAIRING_RECONCILE_INTERVAL_MS: ${PAIRING_RECONCILE_INTERVAL_MS:-5000}
      RECONCILER_HEALTH_PORT: "3001"
    depends_on:
      relay:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - web-data:/app/data
    restart: unless-stopped
    logging: *bounded-logs
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  production-monitor:
    build:
      context: ../ops
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set in .env}
      WEB_INTERNAL_ORIGIN: http://web:3000
      RELAY_INTERNAL_ORIGIN: http://relay:3000
      RECONCILER_HEALTH_URL: http://pairing-reconciler:3001/healthz
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-30000}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:-3}
      MONITOR_TLS_MIN_DAYS: ${MONITOR_TLS_MIN_DAYS:-14}
      MONITOR_ALERT_WEBHOOK_URL: ${MONITOR_ALERT_WEBHOOK_URL:-}
      MONITOR_ALERT_EMAIL_TO: ${MONITOR_ALERT_EMAIL_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      relay:
        condition: service_started
      web:
        condition: service_started
      pairing-reconciler:
        condition: service_started
    restart: unless-stopped
    logging: *bounded-logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # 无邮件时的 CLI 逃生通道。包装器把固定 --config 插到动态子命令之后。
  web-tools:
    profiles:
      - tools
    build:
      context: ../web
      target: build
    working_dir: /app
    user: "1000:1000"
    volumes:
      - web-data:/app/data
    environment:
      HRACK_WEB_DATA: /app/data
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set in .env}
      PAIRING_ENC_KEY: ${PAIRING_ENC_KEY:?set in .env}
      SETTINGS_ENC_KEY: ${SETTINGS_ENC_KEY:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        subcommand="$${1:?pass an auth CLI subcommand}"
        shift
        exec node_modules/.bin/auth "$$subcommand" --config better-auth.config.ts "$$@"
      - auth-entrypoint

  nginx:
    image: nginx:1.27-bookworm
    profiles:
      - edge
    depends_on:
      - web
      - relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.hrack.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.routes.conf:/etc/nginx/hrack.routes.conf:ro
      # 证书路径按实际环境替换
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    logging: *bounded-logs

  host-edge:
    image: nginx:1.27-bookworm
    profiles:
      - host-edge
    depends_on:
      relay:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_EDGE_PORT:-8788}:80"
    volumes:
      - ./nginx.host-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.routes.conf:/etc/nginx/hrack.routes.conf:ro
    restart: unless-stopped
    logging: *bounded-logs

volumes:
  web-data:
