# 正式宿主反代模式：只绑定宿主 loopback，由 1Panel/OpenResty/Caddy 终止 TLS。
# 外层反代必须传 Host、X-Forwarded-Proto、X-Real-IP 与 WebSocket Upgrade。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_real_ip $forwarded_real_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    include /etc/nginx/hrack.routes.conf;
}
