# DSH 专用 loopback 入口。外层反代把独立 DSH 域名转到 DSH_HOST_EDGE_PORT，
# 必须保留原 Host 和 WebSocket Upgrade；此层不终止身份。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    include /etc/nginx/hrack.dsh.routes.conf;
}
